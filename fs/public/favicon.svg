<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kds-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163f6d" />
      <stop offset="100%" stop-color="#0e2a4a" />
    </linearGradient>
    <linearGradient id="kds-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d233c" />
      <stop offset="100%" stop-color="#05111e" />
    </linearGradient>
    <linearGradient id="kds-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <style>
    .bg { fill: url(#kds-bg-light); }
    .rim { stroke: #38bdf8; stroke-opacity: 0.35; }
    .fg-white { fill: #ffffff; }
    .fg-accent { fill: url(#kds-cyan); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#kds-bg-dark); }
      .rim { stroke: #38bdf8; stroke-opacity: 0.55; }
      .fg-white { fill: #f8fafc; }
    }
  </style>

  <!-- Background tile -->
  <rect class="bg" width="512" height="512" rx="112" />
  <rect class="rim" x="6" y="6" width="500" height="500" rx="106" fill="none" stroke-width="8" />

  <!-- Monogram & Symbol -->
  <g filter="url(#subtle-shadow)">
    <!-- Left vertical pillar of K -->
    <rect class="fg-white" x="104" y="104" width="68" height="304" rx="16" />

    <!-- Upper diagonal arm: raised tipper bed angle in electric sky blue -->
    <path class="fg-accent" d="M 194 246 L 350 110 A 18 18 0 0 1 376 112 L 396 134 A 18 18 0 0 1 396 160 L 260 286 A 8 8 0 0 1 248 286 L 198 258 A 8 8 0 0 1 194 246 Z" />

    <!-- Lower diagonal arm: heavy base anchor in solid white -->
    <path class="fg-white" d="M 230 252 L 382 384 A 18 18 0 0 1 384 410 L 364 430 A 18 18 0 0 1 338 430 L 194 300 A 8 8 0 0 1 194 288 L 220 254 A 8 8 0 0 1 230 252 Z" />

    <!-- Hydraulic pivot accent -->
    <circle cx="194" cy="272" r="10" fill="#38bdf8" />
  </g>
</svg>